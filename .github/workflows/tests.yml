name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Eval quality gate (40 invoices from cache, 0 $, fails on any false approval)
        run: python scripts/run_eval.py --reader openrouter --offline
