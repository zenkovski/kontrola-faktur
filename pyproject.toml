[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kontrola-faktur"
version = "1.0.0"
description = "Invoice checks where AI reads and code decides. Three-way match, duplicates, prompt-injection guard. Web, REST API and MCP server."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "mcp>=2.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
api = ["anthropic>=0.76"]          # Claude API reader (faktury/extract.py)
render = ["playwright>=1.44", "qrcode>=7.4"]   # drawing invoice PDFs
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.44", "qrcode>=7.4"]

[project.scripts]
kontrola-faktur-mcp = "faktury.mcp_server:main"

[tool.setuptools]
packages = ["faktury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
